# === Vendetta System Config ===

blood-debt:
  hunted-glow-interval-seconds: 60
  hunted-glow-duration-seconds: 5
  repeat-kill-prize-xp-levels: 3

hardcore:
  starting-lives: 3
  # 0 = no cap on lives gained from crafting Extra Life Totems
  max-lives: 0
  # if true, frozen players go to spectator mode until revenge kill happens
  use-spectator-freeze: true

death-curses:
  # consecutive PvP losses (streak) needed to reach each tier
  tier-1-streak: 2
  tier-2-streak: 3
  tier-3-streak: 4
  tier-1-slowness-seconds: 60
  tier-2-debuff-seconds: 90
  tier-3-exile-seconds: 600
