name: VendettaSystem
version: '1.0.0'
main: com.rivalrysmp.vendetta.VendettaPlugin
api-version: '1.21'
author: RivalrySMP
description: Blood Debt, Bounties, Hardcore Lives, The Reckoning, and Legacy Book for Rivalry SMP
softdepend: [Vault, floodgate]

commands:
  bounty:
    description: Place or check a bounty on a player
    usage: /bounty place <player> <amount> | /bounty list
  reckoning:
    description: Manage or bet on The Reckoning event
    usage: /reckoning bet <player> <amount> | /reckoning info
  legacy:
    description: View the Legacy Book log
    usage: /legacy [player]
  lives:
    description: Check remaining hardcore lives
    usage: /lives [player]
